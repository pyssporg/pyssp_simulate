[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyssp_simulate"
version = "0.2.0"
description = "Simulate SSP (System Structure and Parameterization) packages through a common interface and normalise the results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pyssporg" }]
requires-python = ">=3.10"
keywords = ["SSP", "FMI", "FMU", "co-simulation", "simulation", "System Structure and Parameterization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# FMPy installs from PyPI on all platforms, so it ships with the base
# install. The default backend (omsimulator) and the other backends are
# optional (see [project.optional-dependencies] and the README).
dependencies = [
    "numpy>=1.24",
    "fmpy>=0.3.20",
]

[project.optional-dependencies]
# OMSimulator's sdist downloads binaries at install time; it works on
# current platforms (e.g. Ubuntu 24.04) but can fail on distributions
# whose build artifacts are no longer published. See README.
omsimulator = ["OMSimulator>=3.0.0.post115"]
# Dymola ``dsres`` MAT result files; only read_dymola_mat needs scipy.
dymola = ["scipy"]
# Cross-backend measurement inside permutation runs. pyssp_vv is not on PyPI
# yet, so this extra documents the intent; install it from the sibling
# checkout during development (see the repository README).
measure = ["pyssp-vv[measure]>=0.1"]
all = ["pyssp_simulate[omsimulator,measure]"]
dev = [
    "pytest>=7",
    "ruff",
    "pyssp-standard>=0.9.1",
    # The test suite measures with pyssp_vv; install it from the sibling
    # checkout until it is published: pip install -e ../pyssp_vv[measure]
]

[project.scripts]
pyssp-simulate = "pyssp_simulate.cli:main"

[project.urls]
Homepage = "https://github.com/pyssporg/pyssp_simulate"
Repository = "https://github.com/pyssporg/pyssp_simulate"
Issues = "https://github.com/pyssporg/pyssp_simulate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_simulate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "level_static: suite configuration and collected-test contracts",
    "level_unit: pure functions with no filesystem or engine",
    "level_component: one module against synthetic inputs",
    "level_contract: adapter boundary with a stubbed engine",
    "level_integration: a real simulation engine runs an SSP package",
    "level_system: CLI and batch workflow through the public entry points",
    "level_acceptance: end-to-end acceptance over committed fixtures",
    "slow: takes noticeably longer than the default run budget",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
