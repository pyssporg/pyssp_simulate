[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyssp_simulate"
version = "0.3.0"
description = "Simulate SSP (System Structure and Parameterization) packages through a common interface and normalise the results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pyssporg" }]
requires-python = ">=3.11"
keywords = ["SSP", "FMI", "FMU", "co-simulation", "simulation", "System Structure and Parameterization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Every runtime dependency ships in the base install: FMPy from PyPI, the
# OMSimulator backend (whose sdist downloads binaries at install time; it can
# fail on distributions whose build artifacts are no longer published), scipy
# for the Dymola MAT reader, pyssp-vv for cross-backend measurement, and the
# ssp4sim Python bindings. ssp4sim is not on PyPI and publishes Linux x86_64
# wheels only, so its requirement is guarded by an environment marker to keep
# the metadata installable on other platforms.
# Sibling requirements are direct URLs, not index lookups: each URL is an
# immutable release asset attached by that package's wheels.yml, its tag is
# v<version>, and an unreleased tag makes the wheel uninstallable.
dependencies = [
    "numpy>=1.24",
    "fmpy>=0.3.20",
    "OMSimulator>=3.0.0.post115",
    "scipy",
    "pyssp-vv @ https://github.com/pyssporg/pyssp_vv/releases/download/v0.2.0/pyssp_vv-0.2.0-py3-none-any.whl",
    "pyssp4sim @ https://github.com/pyssporg/ssp4sim/releases/download/v0.3.4/pyssp4sim-0.3.4-cp39-abi3-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# The tests import scipy (tests/test_result.py) and pyssp_vv.measure
# (tests/test_backends.py) unconditionally.
dev = [
    "pytest>=7",
    "ruff",
    "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.3.dev0/experimental_pyssp_standard-0.9.3.dev0-py3-none-any.whl",
    "pyssp-vv @ https://github.com/pyssporg/pyssp_vv/releases/download/v0.2.0/pyssp_vv-0.2.0-py3-none-any.whl",
    "scipy",
]

[project.scripts]
pyssp-simulate = "pyssp_simulate.cli:main"
[project.urls]
Homepage = "https://github.com/pyssporg/pyssp_simulate"
Repository = "https://github.com/pyssporg/pyssp_simulate"
Issues = "https://github.com/pyssporg/pyssp_simulate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_simulate"]

# Sibling requirements above are direct URLs; hatchling refuses them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "level_static: suite configuration and collected-test contracts",
    "level_unit: pure functions with no filesystem or engine",
    "level_component: one module against synthetic inputs",
    "level_contract: adapter boundary with a stubbed engine",
    "level_integration: a real simulation engine runs an SSP package",
    "level_system: CLI and batch workflow through the public entry points",
    "level_acceptance: end-to-end acceptance over committed fixtures",
    "slow: takes noticeably longer than the default run budget",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
