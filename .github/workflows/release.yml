# Build the package and publish a GitHub Release with the sdist and wheel.
#
# Triggered by pushing a version tag (vX.Y.Z). The tag must match the
# version declared in pyproject.toml, or the workflow fails before
# publishing anything. The attached wheel is what the README's install
# instructions point at, so users can install a pinned release without
# cloning the repository:
#
#   pip install https://github.com/pyssporg/pyssp_simulate/releases/download/vX.Y.Z/pyssp_simulate-X.Y.Z-py3-none-any.whl
#
# Cut releases from main commits that passed the Tests workflow. This
# workflow adds the packaging-level gates: metadata checks (twine),
# a version guard, and a smoke test of the built wheel (install, import,
# console script). Re-running the workflow is safe: an existing release
# gets its artifacts clobbered instead of failing.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the version tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          source_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/pyssp_simulate/__init__.py").read_text())
          for node in tree.body:
              if (
                  isinstance(node, ast.Assign)
                  and any(getattr(t, "id", None) == "__version__" for t in node.targets)
              ):
                  print(ast.literal_eval(node.value))
                  break
          PY
          )"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}." >&2
            exit 1
          fi
          if [ "$tag" != "$source_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match src/pyssp_simulate/__init__.py __version__ ${source_version}." >&2
            exit 1
          fi
      - name: Check the built metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          # Pin the OMSimulator sdist whose nightly binary is still published:
          # newer sdists (post198) fetch a linux-focal URL that 404s on the
          # current runner image. post115 is the declared minimum anyway.
          /tmp/smoke/bin/pip install "OMSimulator==3.0.0.post115" dist/*.whl
          /tmp/smoke/bin/python -c "import os, pyssp_simulate; assert pyssp_simulate.__version__ == os.environ['GITHUB_REF_NAME'].removeprefix('v'), pyssp_simulate.__version__"
          /tmp/smoke/bin/pyssp-simulate backends
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
