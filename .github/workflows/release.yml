# Build the package and publish a GitHub Release with the sdist and wheel.
#
# Triggered by pushing a version tag (vX.Y.Z). The tag must match the
# version declared in pyproject.toml, or the workflow fails before
# publishing anything. The attached wheel is what the README's install
# instructions point at, so users can install a pinned release without
# cloning the repository:
#
#   pip install https://github.com/pyssporg/pyssp_simulate/releases/download/vX.Y.Z/pyssp_simulate-X.Y.Z-py3-none-any.whl
#
# Cut releases from main commits that passed the Tests workflow. This
# workflow adds the packaging-level gates: metadata checks (twine),
# a version guard, and a smoke test of the built wheel (install, import,
# console script). Re-running the workflow is safe: an existing release
# gets its artifacts clobbered instead of failing.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the version tag
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}." >&2
            exit 1
          fi
      - name: Check the built metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import pyssp_simulate"
          /tmp/smoke/bin/pyssp-simulate backends
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
