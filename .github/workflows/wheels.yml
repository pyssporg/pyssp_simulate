# Build the wheel on every push to main and keep it as a downloadable
# artifact, so packaging breakage shows up on normal commits instead of at
# release time.
#
# This workflow only builds and checks metadata: it never publishes. Tag
# releases (and the GitHub Release upload) stay in release.yml.

name: Wheels

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Check the built metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: pyssp_simulate-wheel
          path: dist/*.whl
          if-no-files-found: error
